name: CI

# Three questions, answered on every push and pull request:
#   1. Do the literate chapters still match the generated Lisp, and do the
#      tests that need no packages pass?                             (tangle)
#   2. Does a fresh clone install its packages and start, on the oldest
#      supported Emacs and the current one?  And on macOS, and on Windows,
#      the machine this is written on?                              (startup)
#   3. Does the Nix flake still evaluate, with its nix-darwin and
#      nix-on-droid examples?                                           (nix)
# The weekly run skips the package cache so upstream package breakage
# shows up even when nothing here changed.
#
# tests/kittymacs-frames-tests.el is the one suite not run here: it needs a
# graphical session, and README.md says how to run it by hand.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tangle:
    name: Chapters match generated Lisp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master as of 2026-09-24
        with:
          version: "31.1"
      - name: Tangle check
        run: emacs -Q --batch -l tools/tangle.el -- --check
      - name: Tangle tests
        run: emacs -Q --batch -l tests/kittymacs-tangle-tests.el -f ert-run-tests-batch-and-exit
      - name: Platform tests (every operating system's branch, no packages)
        run: emacs -Q --batch -l tests/kittymacs-platform-tests.el -f ert-run-tests-batch-and-exit
      - name: Tree-sitter policy tests (offline)
        run: emacs -Q --batch -l tests/kittymacs-treesit-tests.el -f ert-run-tests-batch-and-exit

  startup:
    name: Fresh install and startup (${{ matrix.system }}, Emacs ${{ matrix.emacs }})
    runs-on: ${{ matrix.os }}
    # The macOS and Windows runs are informational until their runners have
    # proven stable here; the platform tests above already exercise those
    # branches on Linux.
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: Linux
            emacs: "30.1"
            informational: false
          - os: ubuntu-latest
            system: Linux
            emacs: "31.1"
            informational: false
          - os: macos-latest
            system: macOS
            emacs: "31.1"
            informational: true
          - os: windows-latest
            system: Windows
            emacs: "30.1"
            informational: true
    # Git Bash on Windows, so every step is written once.
    defaults:
      run:
        shell: bash
    env:
      KITTYMACS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master as of 2026-09-24
        with:
          version: ${{ matrix.emacs }}
      - if: runner.os == 'Windows'
        uses: jcs090218/setup-emacs@54b61ac9c1d7011a54d2b6d66dedbcddf20e2fb9 # master as of 2026-09-24
        with:
          version: ${{ matrix.emacs }}
      - name: Restore the package directory
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: var/elpa
          key: elpa-${{ runner.os }}-${{ matrix.emacs }}-${{ hashFiles('lisp/*.el', 'early-init.el', 'init.el') }}
          restore-keys: elpa-${{ runner.os }}-${{ matrix.emacs }}-
      - name: Install packages by starting the configuration
        run: |
          emacs -Q --batch \
            --eval '(setq user-emacs-directory (file-name-as-directory (expand-file-name ".")))' \
            --eval '(setq native-comp-jit-compilation nil package-native-compile nil)' \
            -l early-init.el --eval '(package-refresh-contents)' -l init.el \
            --eval '(require (quote org-roam))' \
            --eval '(princ (format "%d packages active, leader bound: %S\n" (length package-activated-list) (keymapp (keymap-lookup meow-normal-state-keymap "SPC"))))'
      - name: Leader tests
        run: emacs -Q --batch -l tests/kittymacs-leader-tests.el -f ert-run-tests-batch-and-exit
      - name: Scoped Org-roam tests
        run: emacs -Q --batch -l tests/kittymacs-org-roam-tests.el -f ert-run-tests-batch-and-exit
      - name: Startup verifier
        run: emacs -Q --batch -l tests/verify-config.el

  nix:
    name: Flake evaluates, with its example hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Flake check
        run: nix flake check --no-build --all-systems
      - name: Evaluate the example nix-darwin host against this checkout
        run: |
          nix eval --no-write-lock-file --override-input kittymacs "path:$PWD" \
            --json ./nix/example#darwinConfigurations.example.config.environment.systemPackages \
            --apply 'ps: map (p: p.name) ps'
      - name: Evaluate the example nix-on-droid device against this checkout
        run: |
          nix eval --no-write-lock-file --override-input kittymacs "path:$PWD" \
            --json ./nix/example-nix-on-droid#nixOnDroidConfigurations.default.config.home-manager.config.home.packages \
            --apply 'ps: map (p: p.name) ps'
