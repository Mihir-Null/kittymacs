name: CI

# Three questions, answered on every push and pull request:
#   1. Do the literate chapters still match the generated Lisp?  (tangle)
#   2. Does a fresh clone install its packages and start, on the oldest
#      supported Emacs and the current one?                        (startup)
#   3. Does the same hold on Windows, the machine this is written on? (windows)
#   4. And on macOS?                                                    (macos)
#   5. Does the Nix flake still evaluate, with its nix-darwin and
#      nix-on-droid examples?  (nix)
# The weekly run skips the package cache so upstream package breakage
# shows up even when nothing here changed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tangle:
    name: Chapters match generated Lisp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: "31.1"
      - name: Tangle check
        run: emacs -Q --batch -l tools/tangle.el -- --check
      - name: Tangle tests
        run: emacs -Q --batch -l tests/tangle-tests.el -f ert-run-tests-batch-and-exit
      - name: Platform tests (every operating system's branch, no packages)
        run: emacs -Q --batch -l tests/kittymacs-platform-tests.el -f ert-run-tests-batch-and-exit
      - name: Tree-sitter policy tests (offline)
        run: emacs -Q --batch -l tests/kittymacs-treesit-tests.el -f ert-run-tests-batch-and-exit

  startup:
    name: Fresh install and startup (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["30.1", "31.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Restore the package directory
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: var/elpa
          key: elpa-${{ runner.os }}-${{ matrix.emacs }}-${{ hashFiles('lisp/*.el', 'early-init.el', 'init.el') }}
          restore-keys: elpa-${{ runner.os }}-${{ matrix.emacs }}-
      - name: Install packages by starting the configuration
        run: |
          emacs -Q --batch \
            --eval '(setq user-emacs-directory (file-name-as-directory (expand-file-name ".")))' \
            --eval '(setq native-comp-jit-compilation nil package-native-compile nil)' \
            -l early-init.el -f package-refresh-contents -l init.el \
            --eval '(require (quote org-roam))' \
            --eval '(princ (format "%d packages active, leader bound: %S\n" (length package-activated-list) (keymapp (keymap-lookup meow-normal-state-keymap "SPC"))))'
      - name: Leader tests
        run: emacs -Q --batch -l tests/kittymacs-leader-tests.el -f ert-run-tests-batch-and-exit
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
      - name: Scoped Org-roam tests
        run: emacs -Q --batch -l tests/kittymacs-org-roam-tests.el -f ert-run-tests-batch-and-exit
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
      - name: Startup verifier
        run: emacs -Q --batch -l tests/verify-config.el
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa

  macos:
    name: Fresh install and startup (macOS, Emacs 31.1)
    runs-on: macos-latest
    # Informational until the macOS runner has proven stable here; the
    # platform tests above already exercise the macOS branches on Linux.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: "31.1"
      - name: Restore the package directory
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: var/elpa
          key: elpa-${{ runner.os }}-31.1-${{ hashFiles('lisp/*.el', 'early-init.el', 'init.el') }}
          restore-keys: elpa-${{ runner.os }}-31.1-
      - name: Install packages by starting the configuration
        run: |
          emacs -Q --batch \
            --eval '(setq user-emacs-directory (file-name-as-directory (expand-file-name ".")))' \
            --eval '(setq native-comp-jit-compilation nil package-native-compile nil)' \
            -l early-init.el -f package-refresh-contents -l init.el \
            --eval '(require (quote org-roam))' \
            --eval '(princ (format "%d packages active, command is %S, trash via %S\n" (length package-activated-list) ns-command-modifier (or trash-directory (symbol-function (quote system-move-file-to-trash)))))'
      - name: Leader tests
        run: emacs -Q --batch -l tests/kittymacs-leader-tests.el -f ert-run-tests-batch-and-exit
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
      - name: Scoped Org-roam tests
        run: emacs -Q --batch -l tests/kittymacs-org-roam-tests.el -f ert-run-tests-batch-and-exit
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
      - name: Startup verifier
        run: emacs -Q --batch -l tests/verify-config.el
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa

  nix:
    name: Flake evaluates, with its example hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Flake check
        run: nix flake check --no-build --all-systems
      - name: Evaluate the example nix-darwin host against this checkout
        run: |
          nix eval --no-write-lock-file --override-input kittymacs "path:$PWD" \
            --json ./nix/example#darwinConfigurations.example.config.environment.systemPackages \
            --apply 'ps: map (p: p.name) ps'
      - name: Evaluate the example nix-on-droid device against this checkout
        run: |
          nix eval --no-write-lock-file --override-input kittymacs "path:$PWD" \
            --json ./nix/example-nix-on-droid#nixOnDroidConfigurations.default.config.home-manager.config.home.packages \
            --apply 'ps: map (p: p.name) ps'

  windows:
    name: Fresh install and startup (Windows, Emacs 30.1)
    runs-on: windows-latest
    # Informational until the Windows Emacs action has proven stable here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: jcs090218/setup-emacs@master
        with:
          version: "30.1"
      - name: Restore the package directory
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: var/elpa
          key: elpa-${{ runner.os }}-30.1-${{ hashFiles('lisp/*.el', 'early-init.el', 'init.el') }}
          restore-keys: elpa-${{ runner.os }}-30.1-
      - name: Install packages by starting the configuration
        shell: pwsh
        run: |
          emacs -Q --batch `
            --eval '(setq user-emacs-directory (file-name-as-directory (expand-file-name ".")))' `
            --eval '(setq native-comp-jit-compilation nil package-native-compile nil)' `
            -l early-init.el -f package-refresh-contents -l init.el `
            --eval '(require (quote org-roam))' `
            --eval '(princ (format "%d packages active\n" (length package-activated-list)))'
      - name: Leader tests
        shell: pwsh
        run: emacs -Q --batch -l tests/kittymacs-leader-tests.el -f ert-run-tests-batch-and-exit
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
      - name: Scoped Org-roam tests
        run: emacs -Q --batch -l tests/kittymacs-org-roam-tests.el -f ert-run-tests-batch-and-exit
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
      - name: Startup verifier
        shell: pwsh
        run: emacs -Q --batch -l tests/verify-config.el
        env:
          EMACS_DOTS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
