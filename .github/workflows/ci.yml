name: CI

# Three questions, answered on every push and pull request, each by the
# justfile recipes a contributor runs locally:
#   1. Do the chapters still match the generated files, do the pages follow
#      the conventions, and do the tests that need no packages pass?
#                                                     (tangle: just check)
#   2. Does a fresh clone install its packages, byte-compile and start, on
#      the oldest supported Emacs and the current one?  And on macOS, and
#      on Windows, the machine this is written on?
#                      (startup: just install, compile, test-packages)
#   3. Does the Nix flake still evaluate, with its nix-darwin and
#      nix-on-droid examples and the home-manager module's clone step?
#                                                  (nix: just nix-check)
# The weekly run skips the package cache so upstream package breakage
# shows up even when nothing here changed.
#
# tests/kittymacs-frames-tests.el is the one suite not run here: it needs a
# graphical session: `just frames-test` runs it by hand.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tangle:
    name: Chapters match generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master as of 2026-09-24
        with:
          version: "31.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Tangle check
        run: just tangle-check
      - name: Pages follow the conventions (IDs, tags, links)
        run: just doc-test
      - name: Builder, platform (every operating system's branch) and Tree-sitter tests
        run: just test

  startup:
    name: Fresh install and startup (${{ matrix.system }}, Emacs ${{ matrix.emacs }})
    runs-on: ${{ matrix.os }}
    # The macOS and Windows runs are informational until their runners have
    # proven stable here; the platform tests above already exercise those
    # branches on Linux.
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: Linux
            emacs: "30.1"
            informational: false
          - os: ubuntu-latest
            system: Linux
            emacs: "31.1"
            informational: false
          - os: macos-latest
            system: macOS
            emacs: "31.1"
            informational: true
          - os: windows-latest
            system: Windows
            emacs: "30.1"
            informational: true
    # Git Bash on Windows, so every step is written once.
    defaults:
      run:
        shell: bash
    env:
      KITTYMACS_TEST_PACKAGES: ${{ github.workspace }}/var/elpa
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master as of 2026-09-24
        with:
          version: ${{ matrix.emacs }}
      - if: runner.os == 'Windows'
        uses: jcs090218/setup-emacs@54b61ac9c1d7011a54d2b6d66dedbcddf20e2fb9 # master as of 2026-09-24
        with:
          version: ${{ matrix.emacs }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # A restored directory keeps every package it holds, so a package that
      # moves to another source (a Git checkout to an archive, say) is only
      # tested once the cache starts over: raise the number after "elpa-".
      - name: Restore the package directory
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: var/elpa
          key: elpa-2-${{ runner.os }}-${{ matrix.emacs }}-${{ hashFiles('lisp/*.el', 'early-init.el', 'init.el') }}
          restore-keys: elpa-2-${{ runner.os }}-${{ matrix.emacs }}-
      - name: Install packages by starting the configuration
        run: just install
      # Errors fail the step; warnings are printed and do not, because most
      # of them name a function that a module calls from a package, or from
      # another module, that it does not load while compiling.  Installing
      # is switched off: the step above already did it, and a package that
      # a module declares with :if nil on this system should stay
      # uninstalled.
      - name: Byte-compile the modules
        run: just compile
      - name: Leader and Org-roam tests, and the startup verifier
        run: just test-packages

  nix:
    name: Flake evaluates, with its example hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # The dev shell pins the Emacs, just and the Nix linters, so CI and a
      # laptop agree.
      - name: Lint the generated Nix, evaluate the flake and both example hosts
        run: nix develop --command just nix-check
      # git+file rather than path:, because a path: input has no revision
      # and the module would have nothing to pin.  The checkout is clean
      # here, so the flake's revision is the commit under test, and the
      # module's default must be that commit.
      - name: Evaluate the home-manager module's clone options on the device
        run: |
          options=$(nix eval --no-write-lock-file \
            --override-input kittymacs "git+file://$PWD?shallow=1" \
            --json ./nix/example-nix-on-droid#nixOnDroidConfigurations.default.config.home-manager.config \
            --apply 'c: { inherit (c.programs.kittymacs) repository revision daemon initDirectory; clones = builtins.isString c.home.activation.cloneKittymacs.data; }')
          echo "$options"
          test "$(jq -r .revision <<<"$options")" = "$(git rev-parse HEAD)"
          test "$(jq -r .clones <<<"$options")" = true
          # The daemon must name the link, not leave the directory to
          # whatever the home holds; `source' is set there, so it is not null.
          test "$(jq -r '.initDirectory | endswith("/.config/emacs")' <<<"$options")" = true
