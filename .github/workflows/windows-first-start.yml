name: Windows first start

# A person's first start on native Windows: a fresh clone, no package cache, the
# default profile, with no gpg, Git for Windows' gpg, or a native GnuPG, in batch and
# in a frame.  Every error that reaches the debugger is in the report with its
# backtrace.  It stays out of ci.yml, and nothing waits for it.  Six Windows
# runners are too many for every change to the startup code, so it runs by hand
# (gh workflow run windows-first-start.yml) and when its own files change.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-first-start.yml
      - tests/windows-first-start/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start:
    name: First start (gpg ${{ matrix.gpg }}, ${{ matrix.ui }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        gpg: [none, git, gpg4win]
        ui: [batch, gui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # GNU's own Windows build, as ci.yml installs it.
      - name: Install Emacs from GNU
        shell: bash
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          curl -sSfL -o "$tmp/emacs.zip" \
            "https://ftp.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip"
          7z x -y "-o$(cygpath -w "$tmp/emacs")" "$(cygpath -w "$tmp/emacs.zip")" > /dev/null
          emacs_exe=$(find "$tmp/emacs" -path '*/bin/emacs.exe' | head -n 1)
          test -n "$emacs_exe"
          cygpath -w "$(dirname "$emacs_exe")" >> "$GITHUB_PATH"
      # GnuPG's own build, unpacked where its installer and Gpg4win's put it, which
      # is where early-init.el looks.  Both installers, run by Chocolatey, never
      # returned on a runner, so 7-Zip unpacks this one.
      - name: Install GnuPG
        if: matrix.gpg == 'gpg4win'
        shell: bash
        timeout-minutes: 10
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          curl -sSfL -o "$tmp/gnupg.exe" \
            "https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe"
          7z x -y "-oC:\Program Files\GnuPG" "$(cygpath -w "$tmp/gnupg.exe")" > /dev/null
          "/c/Program Files/GnuPG/bin/gpg.exe" --version
      - name: Start once, as a person's first start
        shell: pwsh
        timeout-minutes: 30
        run: tests/windows-first-start/run.ps1 -Gpg ${{ matrix.gpg }} -Ui ${{ matrix.ui }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-first-start-${{ matrix.gpg }}-${{ matrix.ui }}
          path: windows-first-start-results
